name: Asist CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      mod:
        description: "ipa = IPA üret | derle = yalnız derleme kontrolü (paket yok)"
        type: choice
        options: [ipa, derle]
        default: ipa
      xcode:
        description: "Xcode seçimi: boş = en yeni 26.x | '26.5' | tam yol"
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash          # => bash --noprofile --norc -eo pipefail {0}

jobs:
  core-tests:
    name: AsistCore testleri (Linux, Swift 6.3)
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Ortam bilgisi
        run: |
          swift --version
          ls /usr/share/zoneinfo/Europe/Istanbul
      - name: swift build + swift test
        working-directory: Packages/AsistCore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          swift build --build-tests 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/swift-build.log"
          swift test --skip-build --parallel 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/swift-test.log"
      - name: Hata özeti
        if: failure()
        run: |
          {
            echo "## AsistCore hataları"
            echo '```'
            grep -hE "error:|failed|XCTAssert" "$GITHUB_WORKSPACE"/ci-out/swift-*.log | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Yükle — çekirdek günlükleri
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-gunlukleri
          path: ci-out/*.log
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS derleme + IPA (macOS 26)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      XCODE_MAJOR: "26"
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      MOD: ${{ inputs.mod || 'ipa' }}
    steps:
      - uses: actions/checkout@v7

      - name: Xcode seç
        env:
          XCODE_REQ: ${{ inputs.xcode }}
        run: bash Scripts/ci/select-xcode.sh "$XCODE_REQ"

      - name: XcodeGen kur (sabit sürüm + SHA256)
        run: bash Scripts/ci/install-xcodegen.sh

      - name: Xcode projesini üret
        run: |
          xcodegen generate --spec project.yml 2>&1 | tee "$RUNNER_TEMP/xcodegen.log"
          if grep -q "settings found" "$RUNNER_TEMP/xcodegen.log"; then
            echo "::error::XcodeGen SettingPresets bulunamadı; kurulum bozuk."
            exit 1
          fi
          xcodebuild -list -project Asist.xcodeproj

      - name: Derle (iphoneos, imzasız)
        run: |
          CONFIG=Release
          if [ "$MOD" = "derle" ]; then CONFIG=Debug; fi
          FMT="cat"
          if command -v xcbeautify >/dev/null; then FMT="xcbeautify --renderer github-actions"; fi
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          xcodebuild \
            -project Asist.xcodeproj \
            -scheme Asist \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | $FMT

      - name: Derleme hata özeti
        if: failure()
        run: bash Scripts/ci/error-summary.sh "$RUNNER_TEMP/xcodebuild.log"

      - name: IPA paketle
        if: env.MOD == 'ipa'
        run: |
          bash Scripts/ci/package-ipa.sh \
            "$RUNNER_TEMP/DD/Build/Products/${CONFIG}-iphoneos/Asist.app" \
            "$RUNNER_TEMP/out"

      - name: Yükle — Asist.ipa (entitlement gömülü, ad-hoc)
        if: env.MOD == 'ipa'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/Asist.ipa
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Yükle — Asist-imzasiz.ipa (yedek)
        if: env.MOD == 'ipa'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/Asist-imzasiz.ipa
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Yükle — üretilen Xcode projesi
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Asist-xcodeproj
          path: |
            Asist.xcodeproj
            Generated
          retention-days: 7
          if-no-files-found: warn

      - name: Yükle — derleme günlükleri
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: derleme-gunlukleri
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodegen.log
          retention-days: 7
          if-no-files-found: ignore

  publish-logs:
    name: Günlükleri yayınla (ci-logs dalı)
    needs: [core-tests, ios]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Günlükleri indir
        uses: actions/download-artifact@v8
        with:
          pattern: "*-gunlukleri"
          path: logs
      - name: ci-logs dalına yaz
        env:
          CORE: ${{ needs.core-tests.result }}
          IOS: ${{ needs.ios.result }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "asist-ci"
          git config --global user.email "asist-ci@users.noreply.github.com"
          URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" ci-logs >/dev/null 2>&1; then
            git clone -q --depth 1 --branch ci-logs "$URL" out
          else
            mkdir out && git -C out init -q && git -C out checkout -q --orphan ci-logs
          fi
          D="out/runs/$RUN"
          mkdir -p "$D"
          { echo "run: $RUN"; echo "sha: $SHA"; echo "core-tests: $CORE"; echo "ios: $IOS"; } > "$D/summary.txt"
          ls -R logs > "$D/files.txt" 2>&1 || true
          CL=logs/core-gunlukleri
          if ls "$CL"/*.log >/dev/null 2>&1; then
            grep -hE "error:|CORPUS|failed|XCTAssert|Executed [0-9]+ test|Test Suite '(All tests|AsistCorePackageTests)'" "$CL"/*.log | head -6000 > "$D/core-errors.txt" || true
            tail -n 400 "$CL/swift-test.log" > "$D/core-test-tail.txt" 2>/dev/null || true
            tail -n 200 "$CL/swift-build.log" > "$D/core-build-tail.txt" 2>/dev/null || true
          fi
          IL=logs/derleme-gunlukleri
          if [ -f "$IL/xcodebuild.log" ]; then
            grep -E "(error|warning): " "$IL/xcodebuild.log" | sed -E 's#/Users/runner/work/[^/]+/[^/]+/##g' | sort | uniq | head -4000 > "$D/ios-errors.txt" || true
            tail -n 300 "$IL/xcodebuild.log" | sed -E 's#/Users/runner/work/[^/]+/[^/]+/##g' > "$D/ios-tail.txt"
          fi
          if [ -f "$IL/xcodegen.log" ]; then cp "$IL/xcodegen.log" "$D/xcodegen.log"; fi
          rm -rf out/latest
          cp -R "$D" out/latest
          git -C out add -A
          git -C out commit -q -m "CI günlükleri #$RUN (core: $CORE, ios: $IOS)"
          git -C out push -q "$URL" HEAD:ci-logs
